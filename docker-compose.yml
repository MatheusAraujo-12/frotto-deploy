services:
  backend:
    build:
      context: ./frotto-server-main
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_LOGIN: ${ADMIN_BOOTSTRAP_LOGIN:-}
      BILLING_ENFORCEMENT_ENABLED: ${BILLING_ENFORCEMENT_ENABLED:-false}
      BILLING_RECONCILIATION_ENABLED: ${BILLING_RECONCILIATION_ENABLED:-false}
      BILLING_RECONCILIATION_USER_LOGIN: ${BILLING_RECONCILIATION_USER_LOGIN:-}
      BILLING_RECONCILIATION_AUTO_ENABLED: ${BILLING_RECONCILIATION_AUTO_ENABLED:-false}
      BILLING_RECONCILIATION_AUTO_INTERVAL_MINUTES: ${BILLING_RECONCILIATION_AUTO_INTERVAL_MINUTES:-15}
      BILLING_RECONCILIATION_AUTO_MIN_AGE_MINUTES: ${BILLING_RECONCILIATION_AUTO_MIN_AGE_MINUTES:-5}
      MERCADOPAGO_ENABLED: ${MERCADOPAGO_ENABLED:-false}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_BACK_URL: ${MERCADOPAGO_BACK_URL:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_CONNECT_TIMEOUT_MILLIS: ${MERCADOPAGO_CONNECT_TIMEOUT_MILLIS:-3000}
      MERCADOPAGO_READ_TIMEOUT_MILLIS: ${MERCADOPAGO_READ_TIMEOUT_MILLIS:-7000}
      MERCADOPAGO_TEST_MODE: ${MERCADOPAGO_TEST_MODE:-false}
      MERCADOPAGO_TEST_PAYER_EMAIL: ${MERCADOPAGO_TEST_PAYER_EMAIL:-}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

  frontend:
    build:
      context: ./frotto-ui-main
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
