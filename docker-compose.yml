services:
  backend:
    build:
      context: ./frotto-server-main
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_LOGIN: ${ADMIN_BOOTSTRAP_LOGIN:-}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

  frontend:
    build:
      context: ./frotto-ui-main
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
