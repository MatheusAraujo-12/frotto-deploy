<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frotto</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <!-- Resolve before first paint while the application bundle loads.
         Only the two critical canvas colors mirror tokens.css; component
         palettes remain in theme CSS. See src/theme/DESIGN_SYSTEM.md. -->
    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem("app-theme"); } catch (_) {}
        var theme = saved === "dark" || saved === "light" ? saved :
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === "dark" ? "#0D1B2A" : "#F7F9FC";
      })();
    </script>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="shortcut icon" type="image/png" href="%PUBLIC_URL%/assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Frotto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="root"></div>
  </body>

</html>
