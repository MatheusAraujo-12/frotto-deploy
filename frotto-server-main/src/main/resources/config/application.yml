# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
mercadopago:
  enabled: ${MERCADOPAGO_ENABLED:false}
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  back-url: ${MERCADOPAGO_BACK_URL:}
  connect-timeout-millis: ${MERCADOPAGO_CONNECT_TIMEOUT_MILLIS:3000}
  read-timeout-millis: ${MERCADOPAGO_READ_TIMEOUT_MILLIS:7000}
  test-mode: ${MERCADOPAGO_TEST_MODE:false}
  test-payer-email: ${MERCADOPAGO_TEST_PAYER_EMAIL:}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          [
            'configprops',
            'env',
            'health',
            'info',
            'jhimetrics',
            'jhiopenapigroups',
            'logfile',
            'loggers',
            'prometheus',
            'threaddump',
            'caches',
            'liquibase',
          ]
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  metrics:
    export:
      # Prometheus is the default metrics backend
      prometheus:
        enabled: true
        step: 60
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    tags:
      application: ${spring.application.name}
    web:
      server:
        request:
          autotime:
            enabled: true

spring:
  application:
    name: localmais
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: #spring.profiles.active#
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      "[hibernate.id.new_generator_mappings]": true
      "[hibernate.connection.provider_disables_autocommit]": true
      "[hibernate.cache.use_second_level_cache]": true
      "[hibernate.cache.use_query_cache]": false
      "[hibernate.generate_statistics]": false
      # modify batch size as necessary
      "[hibernate.jdbc.batch_size]": 25
      "[hibernate.order_inserts]": true
      "[hibernate.order_updates]": true
      "[hibernate.query.fail_on_pagination_over_collection_fetch]": true
      "[hibernate.query.in_clause_parameter_padding]": true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  task:
    execution:
      thread-name-prefix: localmais-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: localmais-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      enabled: always

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'localmaisApp'
  # By default CORS is disabled. Uncomment to enable.
  cors:
    allowed-origins: '*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
  mail:
    from: localmais@localhost
  api-docs:
    default-include-pattern: ${server.servlet.context-path:}/api/**
    management-include-pattern: ${server.servlet.context-path:}/management/**
    title: Localmais API
    description: Localmais API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:


# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
aws:
  region: us-east-1
  accessKeyId: ${AWS_ACCESS_KEY_ID:}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY:}

# Billing Etapa 3 feature flag. Must stay false unless explicitly overridden - staging can set
# BILLING_ENFORCEMENT_ENABLED=true (Spring relaxed env-var binding); production with no
# explicit override keeps this default. See CarResource#createCarInternal for the enforcement
# point this gates, and the Billing Etapa 3 report for the grandfathering rollout that should
# land before this is ever turned on anywhere real users exist.
billing:
  enforcement:
    enabled: ${BILLING_ENFORCEMENT_ENABLED:false}

# Billing operational one-off: reconciles a single user's already-authorized Mercado Pago
# subscription without waiting for (or resending) a webhook, and without any new charge - see
# com.localuz.config.BillingReconciliationRunner. Must stay disabled by default in every
# environment; the runner itself refuses to act unless mercadopago.test-mode is also true, so it
# can never fire against production even if left enabled by mistake. Same one-deploy-then-revert
# discipline as admin.bootstrap above.
  reconciliation:
    enabled: ${BILLING_RECONCILIATION_ENABLED:false}
    user-login: ${BILLING_RECONCILIATION_USER_LOGIN:}

# Billing Etapa 4A: one-shot operational bootstrap to promote a single pre-existing user to
# ROLE_ADMIN. Must stay disabled by default in every environment - only ever meant to be
# flipped to true for one deploy in staging (or, later, production), then flipped back to
# false. Never set admin.bootstrap.login in a committed file - pass it via
# ADMIN_BOOTSTRAP_LOGIN at deploy time only. See com.localuz.config.AdminBootstrap.
admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    login: ${ADMIN_BOOTSTRAP_LOGIN:}
