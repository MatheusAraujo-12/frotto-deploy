# ===================================================================
# Spring Boot configuration for the "prod" profile.
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.localuz: INFO

management:
  metrics:
    export:
      prometheus:
        enabled: false

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      poolName: Hikari
      auto-commit: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
      max-lifetime: 30000

  liquibase:
    contexts: prod
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none

  mail:
    host: localhost
    port: 25
    username:
    password:

  thymeleaf:
    cache: true

# ===================================================================
# Server
# ===================================================================
server:
  port: 5000
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# ===================================================================
# JHipster specific properties
# ===================================================================
jhipster:
  # Fonte única de configuração de CORS (aplicada pelo CorsFilter em WebConfigurer.java).
  # O antigo CorsConfig.java (WebMvcConfigurer duplicado, sem PATCH e com origens
  # divergentes) foi removido — não altere CORS em outro lugar do backend.
  cors:
    # "http://localhost" é mantido propositalmente: é a origem padrão da WebView de apps
    # Capacitor (Android), não um resquício de desenvolvimento — preservado conforme uso do
    # app mobile. Os demais valores vêm do domínio confirmado do projeto (frotto.com.br).
    allowed-origins: "http://localhost,https://frotto.com.br,https://www.frotto.com.br"
    allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    allowed-headers: "*"
    exposed-headers: "Authorization,Link,X-Total-Count"
    allow-credentials: false
    max-age: 1800

  http:
    cache:
      timeToLiveInDays: 1461

  cache:
    ehcache:
      time-to-live-seconds: 3600
      max-entries: 1000

  security:
    authentication:
      jwt:
        # CRÍTICO (auditoria): segredo hardcoded removido. Obrigatório definir a variável de
        # ambiente JWT_BASE64_SECRET na VPS. Sem ela, a aplicação falha ao iniciar (fail-fast)
        # em vez de usar um segredo padrão inseguro. Gere um valor novo com:
        #   openssl rand -base64 64
        # Nunca reutilize o valor antigo que estava commitado neste arquivo — trate-o como
        # comprometido.
        base64-secret: ${JWT_BASE64_SECRET}
        # 24 horas em segundos (bug anterior: valor estava 1000x maior, ~1000 dias)
        token-validity-in-seconds: 86400
        # 30 dias em segundos, para "lembrar de mim" (mesma proporção original, unidade corrigida)
        token-validity-in-seconds-for-remember-me: 2592000

  mail:
    base-url: https://api.frotto.com.br

  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      queue-size: 512

# ===================================================================
# Application specific properties
# ===================================================================
aws:
  bucketName: localuz-locamais
